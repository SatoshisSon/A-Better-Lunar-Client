name: Build

# Pull Requests: Installer werden gebaut und als Artefakt angehängt.
# Push auf main: zusätzlich wird automatisch ein Release mit den Installern
# veröffentlicht (Tag = Version aus tauri.conf.json, z. B. v0.1.0).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Systempakete
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  bundle:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            rust_targets: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: werden als Standardwerte in den Launcher eingebaut.
          ABLC_MS_CLIENT_ID: ${{ secrets.ABLC_MS_CLIENT_ID }}
          ABLC_DISCORD_APP_ID: ${{ secrets.ABLC_DISCORD_APP_ID }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.event_name == 'push' && 'v__VERSION__' || '' }}
          releaseName: "A Better Lunar Client v__VERSION__"
          releaseBody: |
            ## Download
            - **Windows:** `A.Better.Lunar.Client_…_x64-setup.exe` herunterladen und ausführen.
            - **macOS (Intel & Apple Silicon):** `A.Better.Lunar.Client_…_universal.dmg` öffnen und die App in „Programme“ ziehen.

            Beim ersten Start erscheint eine Sicherheitswarnung, weil die App nicht kostenpflichtig signiert ist:
            - Windows: „Weitere Informationen“ → „Trotzdem ausführen“
            - macOS: Rechtsklick auf die App → „Öffnen“ (bzw. Systemeinstellungen → Datenschutz & Sicherheit → „Dennoch öffnen“)

            Einrichtung des Microsoft-Logins: siehe README.
          releaseDraft: false
          prerelease: false
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error
